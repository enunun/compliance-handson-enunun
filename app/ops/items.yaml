# yaml-language-server: $schema=./schema/items.schema.json
# 運用項目．人が読む一覧(items.md)は mise run ops:render で生成する．

items:
  - id: change-management
    title: 変更管理
    category: 運用管理
    requirements: [SOC2:CC8.1, ISO27001:A.8.32]
    mechanisms:
      - workflow: ci.yml
        job: check
    evidence: ブランチ保護の設定(JSON)と，プルリクエストのレビュー記録
    timing: 定常(変更ごと)
    actor: 自動
    runbook: runbooks/emergency-change.md

  - id: secret-detection
    title: シークレット検出
    category: 運用管理
    requirements: [ISO27001:A.5.17, ISO27001:A.8.4, SSDF:PS.1]
    mechanisms:
      - workflow: ci.yml
        job: secrets
    evidence: gitleaksの結果(JSON，キーは伏せ字)をCIのartifactとして保存
    timing: 定常(変更ごと，コミットごと)
    actor: 自動
    runbook: runbooks/secret-leak.md
