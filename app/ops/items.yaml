# yaml-language-server: $schema=./schema/items.schema.json
# 運用項目．人が読む一覧(items.md)は mise run ops:render で生成する．

items:
  - id: change-management
    title: 変更管理
    category: 運用管理
    requirements: [SOC2:CC8.1, ISO27001:A.8.32]
    mechanisms:
      - workflow: ci.yml
        job: check
    evidence: ブランチ保護の設定(JSON)と，プルリクエストのレビュー記録
    timing: 定常(変更ごと)
    actor: 自動
    runbook: runbooks/emergency-change.md

  - id: secret-detection
    title: シークレット検出
    category: 運用管理
    requirements: [ISO27001:A.5.17, ISO27001:A.8.4, SSDF:PS.1]
    mechanisms:
      - workflow: ci.yml
        job: secrets
    evidence: gitleaksの結果(JSON，キーは伏せ字)をCIのartifactとして保存
    timing: 定常(変更ごと，コミットごと)
    actor: 自動
    runbook: runbooks/secret-leak.md

  - id: dependency-vulnerabilities
    title: 依存関係の脆弱性検査
    category: 基盤運用
    requirements: [ISO27001:A.8.8, SOC2:CC7.1, SSDF:PW.4]
    mechanisms:
      - workflow: ci.yml
        job: sca
    evidence: Trivyの結果(JSON)をCIのartifactとして保存
    timing: 定常(変更ごと)
    actor: 自動
    runbook: runbooks/exception-request.md

  - id: exception-requests
    title: 例外の申請と期限の管理
    category: 業務運用
    requirements: [ISO27001:A.8.8, SOC2:CC3.4]
    mechanisms:
      - workflow: ci.yml
        job: exceptions
    evidence: exceptions.yaml の変更履歴(セキュリティ責任者が承認したプルリクエスト)
    timing: 非定常(申請のとき)と定常(変更ごとに期限を検査)
    actor: 人
    runbook: runbooks/exception-request.md

  - id: sbom
    title: SBOMの作成
    category: 基盤運用
    requirements: [SSDF:PS.3, METI:SBOM導入の手引]
    mechanisms:
      - workflow: ci.yml
        job: sbom
    evidence: コンポーネントごとのSBOM(CycloneDX)を証跡の保管場所に保管
    timing: 定常(変更ごと)
    actor: 自動

  - id: license-policy
    title: ライセンスの検査
    category: 運用管理
    requirements: [ISO27001:A.5.32]
    mechanisms:
      - workflow: ci.yml
        job: sbom
    evidence: ライセンスを含むSBOMと，CIのsbomジョブの結果
    timing: 定常(変更ごと)
    actor: 自動

  - id: evidence-retention
    title: 証跡の保管
    category: 基盤運用
    requirements: [ISO27001:A.5.33, SOC2:CC4.1]
    mechanisms:
      - workflow: ci.yml
        job: evidence
    evidence: 証跡の保管場所の設定(Object Lock，保管期間)と，運用テストの結果
    timing: 定常(変更ごと)
    actor: 自動

  - id: sast
    title: コードの脆弱性検査(SAST)
    category: 基盤運用
    requirements: [ISO27001:A.8.28, SSDF:PW.7]
    mechanisms:
      - workflow: ci.yml
        job: sast
    evidence: Semgrepの結果(JSONとSARIF)を証跡の保管場所に保管
    timing: 定常(変更ごと)
    actor: 自動
    runbook: runbooks/exception-request.md
