# yaml-language-server: $schema=./schema/items.schema.json
# 運用項目．人が読む一覧(items.md)は mise run ops:render で生成する．

items:
  - id: change-management
    title: 変更管理
    category: 運用管理
    requirements: [SOC2:CC8.1, ISO27001:A.8.32]
    mechanisms:
      - workflow: ci.yml
        job: check
    evidence: ブランチ保護の設定(JSON)と，プルリクエストのレビュー記録
    timing: 定常(変更ごと)
    actor: 自動
    runbook: runbooks/emergency-change.md

  - id: secret-detection
    title: シークレット検出
    category: 運用管理
    requirements: [ISO27001:A.5.17, ISO27001:A.8.4, SSDF:PS.1]
    mechanisms:
      - workflow: ci.yml
        job: secrets
    evidence: gitleaksの結果(JSON，キーは伏せ字)をCIのartifactとして保存
    timing: 定常(変更ごと，コミットごと)
    actor: 自動
    runbook: runbooks/secret-leak.md

  - id: dependency-vulnerabilities
    title: 依存関係の脆弱性検査
    category: 基盤運用
    requirements: [ISO27001:A.8.8, SOC2:CC7.1, SSDF:PW.4]
    mechanisms:
      - workflow: ci.yml
        job: sca
    evidence: Trivyの結果(JSON)をCIのartifactとして保存
    timing: 定常(変更ごと)
    actor: 自動
    runbook: runbooks/exception-request.md

  - id: exception-requests
    title: 例外の申請と期限の管理
    category: 業務運用
    requirements: [ISO27001:A.8.8, SOC2:CC3.4]
    mechanisms:
      - workflow: ci.yml
        job: exceptions
    evidence: exceptions.yaml の変更履歴(セキュリティ責任者が承認したプルリクエスト)
    timing: 非定常(申請のとき)と定常(変更ごとに期限を検査)
    actor: 人
    runbook: runbooks/exception-request.md
