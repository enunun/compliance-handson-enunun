# 題材のタスク．道具の版はリポジトリ直下のmise.tomlで固定している．

[tasks.install]
description = "依存パッケージを入れる"
run = [
  "pnpm install --frozen-lockfile",
  "go -C apps/api mod download",
]

[tasks.lint]
description = "TypeScript，Go，OpenTofuのコードを検査する"
depends = ["install"]
run = [
  "pnpm lint",
  "pnpm typecheck",
  "pnpm -r typecheck",
  "test -z \"$(gofmt -l apps/api)\" || { gofmt -l apps/api; exit 1; }",
  "go -C apps/api vet ./...",
  "tofu -chdir=infra fmt -check",
]

[tasks.fmt]
description = "コードを整形する"
depends = ["install"]
run = [
  "pnpm format",
  "gofmt -w apps/api",
  "tofu -chdir=infra fmt",
]

[tasks.test]
description = "単体テストを実行する"
depends = ["install"]
run = [
  "pnpm test",
  "go -C apps/api test ./...",
]

[tasks."test:gates"]
description = "ゲートのテストを実行する"
depends = ["install"]
run = "pnpm test:gates"

[tasks."gate:secrets"]
description = "gitの履歴全体からシークレットを探す(引数でリポジトリの場所を変えられる)"
run = [
  'mkdir -p "${EVIDENCE_DIR:-out/evidence}/secrets"',
  'gitleaks git --config ../.gitleaks.toml --redact --report-format json --report-path "${EVIDENCE_DIR:-out/evidence}/secrets/gitleaks.json"',
]

[tasks."gate:secrets:staged"]
description = "コミットしようとしている変更からシークレットを探す(引数でリポジトリの場所を変えられる)"
run = "gitleaks git --config ../.gitleaks.toml --redact --pre-commit --staged"

[tasks."gate:sca"]
description = "依存関係の既知の脆弱性を検査する"
depends = ["install"]
run = "pnpm exec tsx tools/gates/sca.ts"

[tasks."gate:exceptions"]
description = "例外の期限を検査する"
depends = ["install"]
run = "pnpm exec tsx tools/gates/exceptions.ts"

[tasks."gate:sast"]
description = "コードの脆弱性をSemgrepで検査する"
depends = ["install"]
run = "pnpm exec tsx tools/gates/sast.ts"

[tasks."image:build"]
description = "APIのコンテナイメージを作る(DOCKER_BUILD_ARGS でビルドの引数を足せる)"
run = "docker build ${DOCKER_BUILD_ARGS:-} -t app-api:local apps/api"

[tasks."gate:image"]
description = "APIのコンテナイメージの脆弱性とOSのサポートを検査する"
depends = ["install", "image:build"]
run = "pnpm exec tsx tools/gates/image.ts"

[tasks."gate:config"]
description = "DockerfileとOpenTofuのコードの設定の誤りを検査する"
depends = ["install"]
run = "pnpm exec tsx tools/gates/config.ts"

[tasks.sbom]
description = "コンポーネントごとのSBOM(CycloneDX)を作る"
depends = ["install"]
run = [
  'mkdir -p "${EVIDENCE_DIR:-out/evidence}/sbom"',
  'trivy fs --quiet --format cyclonedx --skip-dirs apps/api,tests/gates/fixtures --output "${EVIDENCE_DIR:-out/evidence}/sbom/web.cdx.json" .',
  'trivy fs --quiet --format cyclonedx --output "${EVIDENCE_DIR:-out/evidence}/sbom/api.cdx.json" apps/api',
]

[tasks."gate:license"]
description = "SBOMの依存関係のライセンスが，許可したものかを検査する"
depends = ["sbom"]
run = 'pnpm exec tsx tools/gates/license.ts "${EVIDENCE_DIR:-out/evidence}"/sbom/*.cdx.json'

[tasks."ops:verify"]
description = "基準値と運用項目を検証し，仕組みとワークフローを突き合わせる"
depends = ["install"]
run = "pnpm exec tsx tools/ops/verify.ts"

[tasks."ops:render"]
description = "items.yaml から運用項目一覧(ops/items.md)を作る"
depends = ["install"]
run = "pnpm exec tsx tools/ops/render.ts"

[tasks."ops:evidence:change"]
description = "mainのブランチ保護の設定を，証跡としてout/evidence/に保存する"
run = """
mkdir -p out/evidence/change
gh api "repos/{owner}/{repo}/branches/main/protection" \
  > "out/evidence/change/branch-protection-$(date +%Y%m%d).json"
echo "wrote out/evidence/change/branch-protection-$(date +%Y%m%d).json"
"""

[tasks."check:code"]
description = "コードと運用項目を検査する(CIのcheckジョブ)"
depends = ["lint", "test", "test:gates", "ops:verify"]

[tasks.gates]
description = "すべてのゲートを実行する(CIではゲートごとのジョブ)"
depends = ["gate:secrets", "gate:sca", "gate:exceptions", "gate:license", "gate:sast", "gate:image", "gate:config"]

[tasks.check]
description = "題材の検査とゲートをまとめて実行する"
depends = ["check:code", "gates"]

[tasks."test:ops"]
description = "運用テストを実行する(先にmise run upを実行する)"
depends = ["install"]
run = "pnpm test:ops"

[tasks."evidence:upload"]
description = "out/evidence/ の証跡を，日付とコミットごとに証跡の保管場所へ送る"
run = """
bucket="$(tofu -chdir=infra output -raw evidence_bucket)"
prefix="$(date -u +%Y-%m-%d)/$(git rev-parse --short HEAD)"
aws s3 cp --recursive out/evidence "s3://${bucket}/${prefix}/"
echo "uploaded to s3://${bucket}/${prefix}/"
"""

[tasks.up]
description = "MiniStackの上に本番の環境を作る"
run = [
  "tofu -chdir=infra init -input=false",
  "tofu -chdir=infra apply -input=false -auto-approve",
]

[tasks.down]
description = "本番の環境を消す(証跡を保管したバケットは，保管期間の間は消せない)"
run = "tofu -chdir=infra destroy -input=false -auto-approve"

[tasks."dev:api"]
description = "APIを起動する(先にmise run upを実行する)"
env = { TEST_USER_PASSWORD = "password" }
run = """
DATABASE_URL="$(tofu -chdir=infra output -raw database_url)" \
go -C apps/api run ./cmd/api
"""

[tasks."dev:web"]
description = "Webの画面を起動する"
run = "pnpm --filter @app/web dev"

[tasks.ci]
description = "GitHub Actionsのワークフローを，actで手元で実行する"
dir = "{{config_root}}/.."
run = "act"
