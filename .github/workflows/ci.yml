name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v3
      - run: mise run check:code

  secrets:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5
        with:
          # 履歴全体を検査するので，すべてのコミットを取得する．
          fetch-depth: 0
      - uses: jdx/mise-action@v3
      - run: mise run gate:secrets
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evidence-secrets
          path: app/out/evidence/

  sca:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v3
      - run: mise run gate:sca
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evidence-sca
          path: app/out/evidence/

  exceptions:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v3
      - run: mise run gate:exceptions

  sbom:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v3
      - run: mise run gate:license
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evidence-sbom
          path: app/out/evidence/

  # ゲートのジョブが残した証跡を集め，証跡の保管場所へ送る．
  # 保管場所は，ジョブの中で起動したMiniStackの上に作る．
  evidence:
    needs: [secrets, sca, sbom]
    if: always()
    runs-on: ubuntu-latest
    services:
      ministack:
        image: ministackorg/ministack:1.5.21@sha256:7a30ff0670578e10528b5a9a21e795ef494f96bbc35691c9b0742ea35de71808
        ports:
          - 4566:4566
        options: --workdir /opt/ministack
    env:
      AWS_ENDPOINT_URL: http://localhost:4566
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_REGION: ap-northeast-1
      AWS_CONFIG_FILE: ${{ github.workspace }}/.devcontainer/aws-config
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5
      # S3 Controlは，アカウントIDを付けたホスト名で接続する．
      - run: echo "127.0.0.1 000000000000.localhost" | sudo tee -a /etc/hosts
      - uses: jdx/mise-action@v3
      - uses: actions/download-artifact@v4
        with:
          pattern: evidence-*
          path: app/out/evidence/
          merge-multiple: true
      - run: mise run up
      - run: mise run test:ops
      - run: mise run evidence:upload
